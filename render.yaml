services:
  - type: web
    name: vortex-ai-chatbot
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: false
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SIMILARITY_THRESHOLD
        value: "0.35"
      - key: MAX_HISTORY_TURNS
        value: "8"
